# Local Postgres for development. Production runs on Neon (see README).
# Port 5434 so it can sit alongside other projects' databases.
services:
    db:
        image: postgres:18-alpine
        container_name: polaris-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: polaris
            POSTGRES_PASSWORD: polaris
            POSTGRES_DB: polaris
        ports:
            - "5434:5432"
        volumes:
            - polaris-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
            interval: 2s
            timeout: 3s
            retries: 15

volumes:
    polaris-data:
